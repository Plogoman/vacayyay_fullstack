name: CI / CD — VacayYay

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Test
  # Runs on every push and every PR
  # ─────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'       # always uses the current LTS
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
         npm ci
         npm rebuild better-sqlite3 --build-from-source

      # ── Linting ──────────────────────────
      # Requires an "lint" script in package.json, e.g.:
      #   "lint": "eslint . --ext .js,.ts"
      # If you don't have ESLint yet, see the note at the bottom of this file.
      - name: Run linter
        continue-on-error: true
        run: |
          chmod +x node_modules/.bin/eslint
          npm run lint
  # ─────────────────────────────────────────
  # JOB 2: Build / Smoke-test
  # Verifies the app actually starts up
  # ─────────────────────────────────────────
  build:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: lint                       # only runs if lint passes


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      # Start the server in the background, wait for it to be ready,
      # then hit the root route to confirm it responds.
      - name: Start server & smoke test
        run: |
          npm start &
          SERVER_PID=$!

          echo "Waiting for server on port 3000..."
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000 && break
            sleep 2
          done

          curl -sf http://localhost:3000 \
            || (echo "Failure Server did not respond" && kill $SERVER_PID && exit 1)

          echo "Success!! Server responded successfully"
          kill $SERVER_PID

  # ─────────────────────────────────────────
  # JOB 3: Deploy
  # Only runs on pushes to main (not PRs)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build                      # only runs if build passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Option A: Deploy via SSH to a VPS ──
      # Uncomment and fill in your server details.
      # Add SSH_PRIVATE_KEY, SERVER_HOST, and SERVER_USER
      # as repository secrets (Settings → Secrets → Actions).
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SERVER_HOST }}
      #     username: ${{ secrets.SERVER_USER }}
      #     key: ${{ secrets.SSH_PRIVATE_KEY }}
      #     script: |
      #       cd ~/vacayyay_fullstack
      #       git pull origin main
      #       npm install --omit=dev
      #       pm2 restart vacayyay || pm2 start npm --name vacayyay -- start

      # ── Option B: Deploy to Render ─────────
      # Add RENDER_DEPLOY_HOOK_URL as a repo secret.
      # (Render dashboard → your service → Settings → Deploy Hook)
